name: Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Python in container
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
          python3 --version
      - name: Check source structure
        run: python3 tools/preflight.py && python3 tools/check_v08.py
      - name: Configure Godot Android export environment
        shell: bash
        run: |
          set -euo pipefail
          GODOT_VERSION=4.4.1.stable
          mkdir -p "$HOME/.local/share/godot/export_templates/$GODOT_VERSION" "$HOME/.config/godot" "$HOME/.android" build
          SOURCE_TEMPLATES="/root/.local/share/godot/export_templates/$GODOT_VERSION"
          if [ ! -f "$HOME/.local/share/godot/export_templates/$GODOT_VERSION/android_debug.apk" ]; then
            if [ ! -f "$SOURCE_TEMPLATES/android_debug.apk" ]; then
              echo "Missing Android export templates in image: $SOURCE_TEMPLATES" >&2
              exit 1
            fi
            cp -a "$SOURCE_TEMPLATES/." "$HOME/.local/share/godot/export_templates/$GODOT_VERSION/"
          fi
          JAVA_SDK=/usr/lib/jvm/java-17-openjdk-amd64
          ANDROID_SDK=/usr/lib/android-sdk
          test -x "$JAVA_SDK/bin/java"
          test -x "$ANDROID_SDK/platform-tools/adb"
          SETTINGS="$HOME/.config/godot/editor_settings-4.4.tres"
          cat > "$SETTINGS" <<SETTINGS_EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_SDK"
          export/android/android_sdk_path = "$ANDROID_SDK"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          SETTINGS_EOF
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK" >> "$GITHUB_ENV"
          ls -lh "$HOME/.local/share/godot/export_templates/$GODOT_VERSION/android_debug.apk"
      - name: Install matching Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK="$ANDROID_HOME"
          echo "Android SDK: $SDK"
          echo "Available SDK tools:"
          find "$SDK" -maxdepth 5 -name sdkmanager -type f -print || true
          SDKMANAGER="$(find "$SDK" /opt -maxdepth 6 -name sdkmanager -type f -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is missing; cannot install matching Android SDK components" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/aapt2"
          echo "Installed Android SDK platforms and build tools:"
          ls -1 "$SDK/platforms" "$SDK/build-tools"
      - name: Import and compile project
        run: bash -o pipefail -c 'godot --headless --path . --editor --import --quit 2>&1 | tee /tmp/godot-import.log'
      - name: Run gameplay smoke test
        run: bash -o pipefail -c 'godot --headless --path . --script res://tests/smoke_test.gd 2>&1 | tee /tmp/godot-smoke.log'
      - name: Prepare debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" build
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Validate Android export configuration
        shell: bash
        run: |
          set -euo pipefail
          echo "HOME=$HOME"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -s "$HOME/.local/share/godot/export_templates/4.4.1.stable/android_debug.apk"
          test -s "$HOME/.android/debug.keystore"
          test -x "$JAVA_HOME/bin/java"
          test -d "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/platforms"
          ls -la "$ANDROID_HOME/build-tools"
          cat "$HOME/.config/godot/editor_settings-4.4.tres"
          python3 - <<'PYCODE'
          from pathlib import Path
          import os
          p = Path('export_presets.cfg')
          s = p.read_text()
          s = s.replace('keystore/debug=""', 'keystore/debug="' + os.environ['HOME'] + '/.android/debug.keystore"')
          p.write_text(s)
          PYCODE
      - name: Export APK for ARM64
        shell: bash
        run: |
          set -o pipefail
          godot --verbose --headless --path . --export-debug Android build/ht2-android-debug.apk 2>&1 | tee /tmp/godot-export.log
      - name: Verify APK
        run: |
          test -s build/ht2-android-debug.apk
          unzip -t build/ht2-android-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: ht2-android-debug-apk
          path: build/ht2-android-debug.apk
          if-no-files-found: error
